name: ✨ ESLint Lint & Report — SGA Backend

# ─────────────────────────────────────────────────────────────
# Solo manual — workflow_dispatch
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a analizar"
        required: true
        default: "dev"
        type: string
      publish_report:
        description: "¿Publicar reporte HTML en gh-pages?"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write
  actions: read

# ─────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # JOB 1 — ESLint Analysis
  # ──────────────────────────────────────────────
  eslint-analysis:
    name: ✨ ESLint Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm ci --prefer-offline

      # ── ESLint con output JSON ──
      - name: 🔬 Ejecutar ESLint
        run: |
          mkdir -p lint-results

          # Ejecutar ESLint — siempre exit 0 para que el workflow no falle
          npx eslint \
            "src/**/*.ts" \
            "src/**/*.js" \
            --format json \
            --output-file lint-results/eslint-results.json \
            --no-error-on-unmatched-pattern \
            2>/dev/null || true

          # Si no produjo JSON válido, crear uno vacío
          if ! python3 -c "import json; json.load(open('lint-results/eslint-results.json'))" 2>/dev/null; then
            echo "[]" > lint-results/eslint-results.json
          fi

          echo "✅ ESLint completado"
          echo "   Archivos analizados: $(python3 -c "
          import json
          d = json.load(open('lint-results/eslint-results.json'))
          total_msgs = sum(len(f.get('messages', [])) for f in d)
          errors  = sum(f.get('errorCount', 0) for f in d)
          warnings= sum(f.get('warningCount', 0) for f in d)
          print(f'{len(d)} archivos | {errors} errores | {warnings} warnings | {total_msgs} mensajes total')
          " 2>/dev/null || echo "?")"

      # ── Guardar resultado como artifact ──
      - name: 💾 Subir resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: lint-results/
          retention-days: 30
          if-no-files-found: warn

      # ── Resumen en GitHub Actions ──
      - name: 📋 Resumen ESLint
        run: |
          echo "## ✨ ESLint — SGA Backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repositorio | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ inputs.branch || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 - lint-results/eslint-results.json >> $GITHUB_STEP_SUMMARY << 'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              errors   = sum(f.get('errorCount', 0) for f in d)
              warnings = sum(f.get('warningCount', 0) for f in d)
              total    = sum(len(f.get('messages', [])) for f in d)
              files_with_issues = sum(1 for f in d if f.get('messages'))
              print(f'- **Archivos analizados:** {len(d)}')
              print(f'- **Archivos con issues:** {files_with_issues}')
              print(f'- **Errores:** {errors}')
              print(f'- **Warnings:** {warnings}')
              print(f'- **Total mensajes:** {total}')
              if errors == 0 and warnings == 0:
                  print('\n✅ **Sin problemas detectados**')
          except Exception as e:
              print(f'Error: {e}')
          PYEOF


  # ──────────────────────────────────────────────
  # JOB 2 — Generar y publicar reporte HTML
  # ──────────────────────────────────────────────
  publish-report:
    name: 📊 Generar & Publicar Reporte
    runs-on: ubuntu-latest
    needs: eslint-analysis
    if: ${{ always() && inputs.publish_report != 'false' }}

    steps:
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          path: source

      - name: 📥 Checkout rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: 🏗️ Inicializar gh-pages si no existe
        run: |
          if [ ! -d "gh-pages" ] || [ -z "$(ls -A gh-pages 2>/dev/null)" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: 📥 Descargar artefactos ESLint
        uses: actions/download-artifact@v4
        with:
          name: eslint-results
          path: lint-results
        continue-on-error: true

      - name: 🔎 Verificar artefactos
        run: |
          echo "── Archivos ESLint encontrados ──"
          find lint-results -name "*.json" -exec ls -lh {} \; 2>/dev/null || echo "⚠️  Sin archivos"
          # Crear vacío si no existe
          mkdir -p lint-results
          if [ ! -f lint-results/eslint-results.json ]; then
            echo "[]" > lint-results/eslint-results.json
            echo "⚠️  Creado JSON vacío"
          fi

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📄 Preparar carpeta de destino
        run: mkdir -p gh-pages/lint

      - name: 🖥️ Generar página de reporte ESLint
        run: |
          python3 source/.github/scripts/generate_lint_page.py \
            lint-results/eslint-results.json \
            gh-pages/lint \
            --repo  "${{ github.repository }}" \
            --branch "${{ inputs.branch || 'dev' }}" \
            --run-id "${{ github.run_id }}"
          echo "✅ Reporte generado:"
          ls -lh gh-pages/lint/

      - name: 🚀 Publicar en gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lint/
          if git diff --cached --quiet; then
            echo "ℹ️  Sin cambios."
            exit 0
          fi
          git commit -m "lint: actualizar reporte ESLint SGA ✨ [skip ci]

          Rama: ${{ inputs.branch || 'dev' }}
          Run:  ${{ github.run_id }}"

          for i in 1 2 3; do
            git pull --rebase origin gh-pages && \
            git push origin gh-pages && \
            echo "✅ Publicado." && break || \
            { echo "⚠️  Intento $i fallido..."; sleep $((i*5)); }
          done

      - name: 🌐 URL del reporte
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          NAME=$(echo "${{ github.repository }}"  | cut -d'/' -f2)
          URL="https://${OWNER}.github.io/${NAME}/lint/"
          echo "🎉 Reporte disponible en: $URL"
          echo "[🌐 Ver reporte ESLint — SGA Backend]($URL)" >> $GITHUB_STEP_SUMMARY
