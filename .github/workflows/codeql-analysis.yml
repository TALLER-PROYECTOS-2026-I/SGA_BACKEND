name: 🔐 CodeQL Security Analysis & Report — SGA Backend

# ─────────────────────────────────────────────────────────────
# Solo manual — workflow_dispatch con parámetros configurables
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a analizar"
        required: true
        default: "dev"
        type: string
      query_suite:
        description: "Suite de queries CodeQL"
        required: true
        default: "security-and-quality"
        type: choice
        options:
          - security-and-quality
          - security-extended
          - security-experimental
      publish_report:
        description: "¿Publicar reporte HTML en gh-pages?"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write
  security-events: write
  actions: read

# ─────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # JOB 1 — Análisis CodeQL
  # ──────────────────────────────────────────────
  codeql-analysis:
    name: 🔍 CodeQL Analysis (javascript/typescript)
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          fetch-depth: 0

      # ── Node.js ──
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm ci --prefer-offline

      # ── CodeQL Init ──
      # TypeScript → CodeQL lo analiza como "javascript"
      - name: 🛡️ Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: ${{ inputs.query_suite || 'security-and-quality' }}
          config: |
            paths-ignore:
              - "node_modules/**"
              - "dist/**"
              - "build/**"
              - "drizzle/**"
              - "coverage/**"
              - "**/*.test.ts"
              - "**/*.spec.ts"
              - "**/*.test.js"
              - "**/*.spec.js"
              - ".github/**"
              - "docs/**"

      # ── Build TypeScript antes del análisis ──
      # Azure Functions requiere compilar TS → JS
      # CodeQL captura el proceso de build para mejor análisis
      - name: 🔨 Build TypeScript (Azure Functions)
        run: |
          npm run build 2>/dev/null || \
          npx tsc --noEmit false 2>/dev/null || \
          echo "⚠️  Build no crítico para el análisis — continuando"

      # ── Análisis CodeQL ──
      - name: 🔬 Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          output: "${{ runner.temp }}/codeql-results"
          upload: true
          add-snippet: true
          wait-for-processing: true

      # ── Guardar SARIF como artifact ──
      - name: 💾 Subir SARIF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-javascript
          path: "${{ runner.temp }}/codeql-results/*.sarif"
          retention-days: 30
          if-no-files-found: warn


  # ──────────────────────────────────────────────
  # JOB 2 — Generar y publicar reporte HTML
  # ──────────────────────────────────────────────
  publish-report:
    name: 📊 Generar & Publicar Reporte
    runs-on: ubuntu-latest
    needs: codeql-analysis
    if: ${{ always() && inputs.publish_report != 'false' }}

    steps:
      # ── Checkout rama de código (para el script) ──
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          path: source

      # ── Checkout gh-pages ──
      - name: 📥 Checkout rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: 🏗️ Inicializar gh-pages si no existe
        run: |
          if [ ! -d "gh-pages" ] || [ -z "$(ls -A gh-pages 2>/dev/null)" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      # ── Descargar artefactos SARIF ──
      - name: 📥 Descargar artefactos SARIF
        uses: actions/download-artifact@v4
        with:
          pattern: codeql-sarif-*
          path: sarif-results
          merge-multiple: true

      - name: 🔎 Listar archivos SARIF descargados
        run: |
          echo "── Archivos SARIF encontrados ──"
          find sarif-results -name "*.sarif" -exec ls -lh {} \; || echo "⚠️  No se encontraron archivos SARIF"
          echo "Total: $(find sarif-results -name '*.sarif' 2>/dev/null | wc -l) archivo(s)"

      # ── Python ──
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📄 Preparar carpeta de destino
        run: mkdir -p gh-pages/codeql

      # ── Generar reporte HTML ──
      - name: 🖥️ Generar página de reporte CodeQL
        run: |
          SARIF_DIR="sarif-results"
          SARIF_COUNT=$(find "$SARIF_DIR" -name "*.sarif" 2>/dev/null | wc -l)

          if [ "$SARIF_COUNT" -eq 0 ]; then
            echo "⚠️  Sin archivos SARIF — generando reporte vacío"
            mkdir -p sarif-empty
            SARIF_DIR="sarif-empty"
          fi

          python3 source/.github/scripts/generate_codeql_page.py \
            "$SARIF_DIR" \
            gh-pages/codeql \
            --repo  "${{ github.repository }}" \
            --branch "${{ inputs.branch || 'dev' }}" \
            --run-id "${{ github.run_id }}"

          echo "✅ Reporte generado:"
          ls -lh gh-pages/codeql/

      # ── Resumen en GitHub Actions ──
      - name: 📋 Resumen de hallazgos
        run: |
          SARIF_FILES=$(find sarif-results -name "*.sarif" 2>/dev/null || true)

          echo "## 🔐 Resumen CodeQL — SGA Backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repositorio | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ inputs.branch || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Lenguaje | \`javascript / typescript\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | \`${{ inputs.query_suite || 'security-and-quality' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -z "$SARIF_FILES" ]; then
            echo "✅ **Sin hallazgos** — análisis limpio." >> $GITHUB_STEP_SUMMARY
          else
            for f in $SARIF_FILES; do
              echo "### 📄 $(basename $f)" >> $GITHUB_STEP_SUMMARY
              python3 - "$f" >> $GITHUB_STEP_SUMMARY << 'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              total = sum(len(r.get('results', [])) for r in d.get('runs', []))
              counts = {}
              for run in d.get('runs', []):
                  for result in run.get('results', []):
                      lvl = result.get('level', 'warning')
                      counts[lvl] = counts.get(lvl, 0) + 1
              print(f'- **Total hallazgos:** {total}')
              print(f'- 🔴 error (crítico): {counts.get("error", 0)}')
              print(f'- 🟠 warning (alto): {counts.get("warning", 0)}')
              print(f'- 🔵 note (medio): {counts.get("note", 0)}')
              print(f'- 🟢 none (bajo): {counts.get("none", 0)}')
          except Exception as e:
              print(f'Error parseando SARIF: {e}')
          PYEOF
            done
          fi

      # ── Publicar en gh-pages (safe: solo toca codeql/) ──
      - name: 🚀 Publicar reporte en gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codeql/
          if git diff --cached --quiet; then
            echo "ℹ️  Sin cambios en el reporte."
            exit 0
          fi
          git commit -m "security: actualizar reporte CodeQL SGA 🔐 [skip ci]

          Rama:  ${{ inputs.branch || 'dev' }}
          Run:   ${{ github.run_id }}
          Suite: ${{ inputs.query_suite || 'security-and-quality' }}"

          # Retry con rebase — evita conflictos si otro workflow pushea al mismo tiempo
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && \
            git push origin gh-pages && \
            echo "✅ Reporte publicado." && break || \
            { echo "⚠️  Intento $i fallido, reintentando en $((i*5))s..."; sleep $((i*5)); }
          done

      # ── URL final ──
      - name: 🌐 URL del reporte
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          NAME=$(echo "${{ github.repository }}"  | cut -d'/' -f2)
          URL="https://${OWNER}.github.io/${NAME}/codeql/"
          echo "🎉 Reporte disponible en: $URL"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[🌐 Ver reporte de seguridad CodeQL — SGA Backend]($URL)" >> $GITHUB_STEP_SUMMARY
