name: 🔍 Trivy Security Scan & Report — SGA Backend

# ─────────────────────────────────────────────────────────────
# Solo manual — workflow_dispatch
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a analizar"
        required: true
        default: "dev"
        type: string
      severity:
        description: "Severidades a reportar"
        required: true
        default: "CRITICAL,HIGH,MEDIUM,LOW"
        type: choice
        options:
          - CRITICAL,HIGH,MEDIUM,LOW
          - CRITICAL,HIGH,MEDIUM
          - CRITICAL,HIGH
          - CRITICAL
      scan_type:
        description: "Tipo de análisis"
        required: true
        default: "fs"
        type: choice
        options:
          - fs          # filesystem: dependencias + secretos + configs
          - repo        # igual que fs pero más completo
      publish_report:
        description: "¿Publicar reporte HTML en gh-pages?"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write
  security-events: write
  actions: read

# ─────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # JOB 1 — Análisis Trivy
  # ──────────────────────────────────────────────
  trivy-scan:
    name: 🔍 Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm ci --prefer-offline

      # ── Instalar Trivy ──
      - name: 🔧 Instalar Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      # ── Scan 1: Dependencias npm (CVE) ──
      - name: 🔬 Trivy — Dependencias npm (CVE)
        run: |
          mkdir -p trivy-results
          trivy fs . \
            --scanners vuln \
            --severity "${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM,LOW' }}" \
            --format json \
            --output trivy-results/npm-vulns.json \
            --ignore-unfixed \
            --pkg-types library \
            --exit-code 0
          echo "✅ Scan de dependencias completado"
          VULN_COUNT=$(python3 -c "
import json
d=json.load(open('trivy-results/npm-vulns.json'))
print(sum(len(r.get('Vulnerabilities') or []) for r in d.get('Results',[])))
" 2>/dev/null || echo '?')
          echo "   Hallazgos CVE: $VULN_COUNT"

      # ── Scan 2: Secretos hardcodeados ──
      - name: 🔬 Trivy — Secretos hardcodeados
        run: |
          trivy fs . \
            --scanners secret \
            --format json \
            --output trivy-results/secrets.json \
            --exit-code 0
          echo "✅ Scan de secretos completado"
          SEC_COUNT=$(python3 -c "
import json
d=json.load(open('trivy-results/secrets.json'))
print(sum(len(r.get('Secrets') or []) for r in d.get('Results',[])))
" 2>/dev/null || echo '?')
          echo "   Secretos detectados: $SEC_COUNT"

      # ── Scan 3: Misconfigurations (package.json, tsconfig, etc) ──
      - name: 🔬 Trivy — Misconfiguraciones
        run: |
          trivy fs . \
            --scanners misconfig \
            --format json \
            --output trivy-results/misconfig.json \
            --exit-code 0
          echo "✅ Scan de misconfiguraciones completado"

      # ── Guardar resultados como artifact ──
      - name: 💾 Subir resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results/
          retention-days: 30
          if-no-files-found: warn

      # ── Resumen rápido en el step ──
      - name: 📋 Resumen rápido
        run: |
          echo "## 🔍 Trivy Scan — SGA Backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repo | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ inputs.branch || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Severidades | \`${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM,LOW' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in trivy-results/*.json; do
            echo "### 📄 $(basename $f)" >> $GITHUB_STEP_SUMMARY
            python3 - "$f" >> $GITHUB_STEP_SUMMARY << 'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              results = d.get('Results', [])
              vuln_total = sum(len(r.get('Vulnerabilities') or []) for r in results)
              sec_total  = sum(len(r.get('Secrets') or []) for r in results)
              mis_total  = sum(len(r.get('Misconfigurations') or []) for r in results)
              if vuln_total:
                  counts = {}
                  for r in results:
                      for v in (r.get('Vulnerabilities') or []):
                          sev = v.get('Severity','UNKNOWN')
                          counts[sev] = counts.get(sev,0) + 1
                  print(f'- **Vulnerabilidades totales:** {vuln_total}')
                  for sev in ['CRITICAL','HIGH','MEDIUM','LOW']:
                      if counts.get(sev,0):
                          print(f'  - {sev}: {counts[sev]}')
              if sec_total:
                  print(f'- **Secretos detectados:** {sec_total}')
              if mis_total:
                  print(f'- **Misconfiguraciones:** {mis_total}')
              if not vuln_total and not sec_total and not mis_total:
                  print('- ✅ Sin hallazgos')
          except Exception as e:
              print(f'Error: {e}')
          PYEOF
          done


  # ──────────────────────────────────────────────
  # JOB 2 — Generar y publicar reporte HTML
  # ──────────────────────────────────────────────
  publish-report:
    name: 📊 Generar & Publicar Reporte
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: ${{ always() && inputs.publish_report != 'false' }}

    steps:
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          path: source

      - name: 📥 Checkout rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: 🏗️ Inicializar gh-pages si no existe
        run: |
          if [ ! -d "gh-pages" ] || [ -z "$(ls -A gh-pages 2>/dev/null)" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: 📥 Descargar artefactos Trivy
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: trivy-results
        continue-on-error: true

      - name: 🔎 Verificar artefactos
        run: |
          echo "── Archivos Trivy encontrados ──"
          find trivy-results -name "*.json" -exec ls -lh {} \; 2>/dev/null || echo "⚠️  Sin archivos"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📄 Preparar carpeta de destino
        run: mkdir -p gh-pages/trivy

      - name: 🖥️ Generar página de reporte Trivy
        run: |
          python3 source/.github/scripts/generate_trivy_page.py \
            trivy-results \
            gh-pages/trivy \
            --repo  "${{ github.repository }}" \
            --branch "${{ inputs.branch || 'dev' }}" \
            --run-id "${{ github.run_id }}" \
            --severity "${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM,LOW' }}"
          echo "✅ Reporte generado:"
          ls -lh gh-pages/trivy/

      - name: 🚀 Publicar en gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trivy/
          if git diff --cached --quiet; then
            echo "ℹ️  Sin cambios."
            exit 0
          fi
          git commit -m "security: actualizar reporte Trivy SGA 🔍 [skip ci]

          Rama:  ${{ inputs.branch || 'dev' }}
          Run:   ${{ github.run_id }}"

          for i in 1 2 3; do
            git pull --rebase origin gh-pages && \
            git push origin gh-pages && \
            echo "✅ Publicado." && break || \
            { echo "⚠️  Intento $i fallido..."; sleep $((i*5)); }
          done

      - name: 🌐 URL del reporte
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          NAME=$(echo "${{ github.repository }}"  | cut -d'/' -f2)
          URL="https://${OWNER}.github.io/${NAME}/trivy/"
          echo "🎉 Reporte disponible en: $URL"
          echo "[🌐 Ver reporte Trivy — SGA Backend]($URL)" >> $GITHUB_STEP_SUMMARY
