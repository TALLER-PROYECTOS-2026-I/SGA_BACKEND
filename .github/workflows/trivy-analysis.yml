name: "\U0001F50D Trivy Security Scan & Report \u2014 SGA Backend"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a analizar"
        required: true
        default: "dev"
        type: string
      severity:
        description: "Severidades a reportar"
        required: true
        default: "CRITICAL,HIGH,MEDIUM,LOW"
        type: choice
        options:
          - "CRITICAL,HIGH,MEDIUM,LOW"
          - "CRITICAL,HIGH,MEDIUM"
          - "CRITICAL,HIGH"
          - "CRITICAL"
      publish_report:
        description: "Publicar reporte HTML en gh-pages?"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write
  security-events: write
  actions: read

jobs:

  trivy-scan:
    name: "Trivy Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --prefer-offline

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      - name: Trivy - Scan CVE dependencias npm
        run: |
          mkdir -p trivy-results
          trivy fs . \
            --scanners vuln \
            --severity "${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM,LOW' }}" \
            --format json \
            --output trivy-results/npm-vulns.json \
            --ignore-unfixed \
            --pkg-types library \
            --exit-code 0
          echo "Scan CVE completado"

      - name: Trivy - Scan secretos hardcodeados
        run: |
          trivy fs . \
            --scanners secret \
            --format json \
            --output trivy-results/secrets.json \
            --exit-code 0
          echo "Scan secretos completado"

      - name: Trivy - Scan misconfiguraciones
        run: |
          trivy fs . \
            --scanners misconfig \
            --format json \
            --output trivy-results/misconfig.json \
            --exit-code 0
          echo "Scan misconfigs completado"

      - name: Contar hallazgos
        run: |
          python3 << 'PYEOF'
          import json, os

          def count_file(path, key):
              try:
                  d = json.load(open(path))
                  return sum(len(r.get(key) or []) for r in d.get('Results', []))
              except Exception:
                  return 0

          vulns   = count_file('trivy-results/npm-vulns.json', 'Vulnerabilities')
          secrets = count_file('trivy-results/secrets.json',   'Secrets')
          misconf = count_file('trivy-results/misconfig.json', 'Misconfigurations')

          print(f"CVE encontrados:      {vulns}")
          print(f"Secretos detectados:  {secrets}")
          print(f"Misconfiguraciones:   {misconf}")
          print(f"Total hallazgos:      {vulns + secrets + misconf}")
          PYEOF

      - name: Subir resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Resumen en GitHub Actions
        run: |
          python3 << 'PYEOF'
          import json, os

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')

          def count_by_sev(results, key):
              counts = {}
              for r in results:
                  for item in (r.get(key) or []):
                      sev = item.get('Severity', 'UNKNOWN')
                      counts[sev] = counts.get(sev, 0) + 1
              return counts

          lines = []
          lines.append("## Trivy Security Scan - SGA Backend\n")
          lines.append(f"| Repo | `${{ github.repository }}` |")
          lines.append("|------|------|")
          lines.append(f"| Rama | `${{ inputs.branch || 'dev' }}` |")
          lines.append(f"| Severidades | `${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM,LOW' }}` |")
          lines.append(f"| Run ID | ${{ github.run_id }} |")
          lines.append("")

          files = {
              'trivy-results/npm-vulns.json': ('Vulnerabilities', 'CVE / Dependencias npm'),
              'trivy-results/secrets.json':   ('Secrets',         'Secretos hardcodeados'),
              'trivy-results/misconfig.json': ('Misconfigurations', 'Misconfiguraciones'),
          }

          for path, (key, label) in files.items():
              try:
                  d = json.load(open(path))
                  results = d.get('Results', [])
                  total = sum(len(r.get(key) or []) for r in results)
                  lines.append(f"### {label}")
                  if total == 0:
                      lines.append("Sin hallazgos")
                  else:
                      counts = count_by_sev(results, key)
                      lines.append(f"**Total: {total}**")
                      for sev in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']:
                          if counts.get(sev, 0):
                              lines.append(f"- {sev}: {counts[sev]}")
              except Exception as e:
                  lines.append(f"Error leyendo {path}: {e}")
              lines.append("")

          with open(summary_path, 'w') as f:
              f.write('\n'.join(lines))

          print("Resumen generado")
          PYEOF


  publish-report:
    name: "Generar y Publicar Reporte HTML"
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: ${{ always() && inputs.publish_report != 'false' }}

    steps:
      - name: Checkout codigo fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'dev' }}
          path: source

      - name: Checkout rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Inicializar gh-pages si no existe
        run: |
          if [ ! -d "gh-pages" ] || [ -z "$(ls -A gh-pages 2>/dev/null)" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: Descargar artefactos Trivy
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: trivy-results
        continue-on-error: true

      - name: Verificar artefactos
        run: |
          mkdir -p trivy-results
          for f in npm-vulns.json secrets.json misconfig.json; do
            if [ ! -f "trivy-results/$f" ]; then
              echo '{"Results":[]}' > "trivy-results/$f"
              echo "Creado vacio: $f"
            fi
          done
          ls -lh trivy-results/

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar carpeta de destino
        run: mkdir -p gh-pages/trivy

      - name: Generar reporte HTML Trivy
        run: |
          python3 source/.github/scripts/generate_trivy_page.py \
            trivy-results \
            gh-pages/trivy \
            --repo  "${{ github.repository }}" \
            --branch "${{ inputs.branch || 'dev' }}" \
            --run-id "${{ github.run_id }}" \
            --severity "${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM,LOW' }}"
          echo "Reporte generado:"
          ls -lh gh-pages/trivy/

      - name: Publicar en gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trivy/
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "security: actualizar reporte Trivy SGA [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push origin gh-pages && echo "Publicado." && break || sleep $((i*5))
          done

      - name: URL del reporte
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          NAME=$(echo "${{ github.repository }}"  | cut -d'/' -f2)
          echo "Reporte disponible en: https://${OWNER}.github.io/${NAME}/trivy/"
